site_name: AiCleverness Developer Manual
site_description: Developer manual for AiCleverness — provider-neutral AI execution runtime for .NET
site_url: https://alexnek.github.io/AICleverness/
repo_url: https://github.com/AlexNek/AICleverness
repo_name: AlexNek/AICleverness

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Dependency Injection: getting-started/dependency-injection.md
  - Core Concepts:
      - Runtime Pipeline: concepts/runtime-pipeline.md
      - LLM Client: concepts/llm-client.md
      - Policies and Strategies: concepts/policies-strategies.md
  - Tools:
      - Defining Tools: tools/defining-tools.md
      - Tool Execution: tools/tool-execution.md
      - Tool Idempotency: tools/tool-idempotency.md
  - Execution Control:
      - Planning: execution/planning.md
      - Quality Gates: execution/quality-gates.md
      - Validators and Transformers: execution/post-processing.md
      - Agent Scoping: execution/agent-scoping.md
  - Streaming:
      - Streaming Execution: streaming/streaming-execution.md
      - Streaming LLM Client: streaming/streaming-llm-client.md
      - Streaming Tool Buffer: streaming/tool-call-buffer.md
  - Memory: memory/memory-tiers.md
  - Security: security/security-approval.md
  - Workflows: workflows/multi-agent.md
  - Operations:
      - Persistence and Hosting: operations/persistence-hosting.md
      - Observability: operations/observability.md
  - API Reference:
      - Core Interfaces: api-reference/interfaces.md
      - Models: api-reference/models.md
      - DI Extensions: api-reference/di-extensions.md
  - FAQ: faq.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AlexNek/AICleverness
